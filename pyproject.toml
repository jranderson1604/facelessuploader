[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "faceless-shorts"
version = "1.0.0"
description = "Generate faceless short videos from Reddit stories"
requires-python = ">=3.10"
dependencies = [
    "praw>=7.7",
    "edge-tts>=6.1",
    "moviepy>=1.0.3",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
faceless = "faceless.cli:main"

[tool.setuptools.packages.find]
include = ["faceless*"]
