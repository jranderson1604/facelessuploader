[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "faceless-uploader"
version = "1.0.0"
description = "Automated faceless shorts generator and multi-platform uploader"
requires-python = ">=3.10"
dependencies = [
    "praw>=7.7",
    "pyttsx3>=2.90",
    "gTTS>=2.5",
    "edge-tts>=6.1",
    "moviepy>=1.0.3",
    "Pillow>=10.0",
    "yt-dlp>=2024.1",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "requests>=2.31",
    "flask>=3.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    "tiktok-uploader>=0.1",
    "instagrapi>=2.0",
]

[project.scripts]
faceless = "faceless.cli:main"

[tool.setuptools.packages.find]
include = ["faceless*"]
